# Download site for Cold Brew. Deploy with: cd site && wrangler deploy
name = "lid-agents-site"
main = "worker.js"
compatibility_date = "2025-09-01"
account_id = "0c48b1025075e124b4d401a3c926e26b"
workers_dev = false
# cold-brew is the site; lid-agents (the address before 1.5) redirects to it in worker.js
